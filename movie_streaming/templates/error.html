{% extends "base.html" %}

{% block title %}Error - CinemaStream{% endblock %}

{% block extra_css %}
<style>
    .error-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        background: linear-gradient(135deg, #0f0c1e 0%, #1a0a3e 100%);
    }

    .error-card {
        text-align: center;
        color: #fff;
        max-width: 500px;
    }

    .error-card h1 {
        font-size: 3em;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #ff6b6b 0%, #ff0000 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .error-card h2 {
        font-size: 1.5em;
        margin-bottom: 15px;
    }

    .error-card p {
        color: #aaa;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .back-home-btn {
        background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
        color: #fff;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .back-home-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
    }
</style>
{% endblock %}

{% block navbar %}
<!-- No navbar on error page -->
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <h1>⚠️</h1>
        <h2>Oops!</h2>
        <p>{{ error or 'Something went wrong. Please try again later.' }}</p>
        <a href="{{ url_for('catalog') }}" class="back-home-btn">Return to Catalog</a>
    </div>
</div>
{% endblock %}
